<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For My Love ❤️</title>
    <style>
        body { margin:0; padding:0; min-height:100vh; overflow:hidden; font-family: sans-serif; background: #7a0019; display:flex; justify-content:center; align-items:center; color:white; }
        
        /* Pehla screen jo music unlock karega */
        #overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgb(122, 0, 25); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        #startBtn { padding:15px 40px; font-size:20px; border:none; border-radius:30px; background:#ff4d6d; color:white; cursor:pointer; font-weight:bold; box-shadow: 0 0 20px rgba(0,0,0,0.3); }

        .wrapper { display:none; flex-direction:column; align-items:center; gap:10px; width:100%; padding:10px; }
        .photos { display:flex; flex-direction:row; gap:8px; }
        .photos img { width:75px; height:100px; object-fit:cover; border-radius:10px; border:2px solid white; }
        .container { background: rgba(0,0,0,0.4); padding:20px; border-radius:20px; width:85%; max-width:300px; z-index:10; }
        h1 { font-size: 1.3rem; margin:10px 0; }
        p { font-size: 0.85rem; line-height:1.4; }
        .buttons { margin-top:15px; }
        button { padding:12px 25px; font-size:16px; border:none; border-radius:30px; cursor:pointer; font-weight:bold; }
        .yes { background:#ff4d6d; color:white; margin-right:10px; }
        .no { background:white; color:#b3002d; position:absolute; }
        .heart { position:absolute; color:#ff4d6d; animation:float 5s linear infinite; pointer-events:none; }
        @keyframes float { 0% {transform:translateY(100vh); opacity:1;} 100% {transform:translateY(-10vh); opacity:0;} }
    </style>
</head>
<body>

<div id="overlay">
    <h2 style="margin-bottom:20px;">Open with Love ❤️</h2>
    <button id="startBtn" onclick="initPage()">ENTER</button>
</div>

<audio id="romanticSong" loop preload="auto">
    <source src="https://files.catbox.moe/978msh.mp3" type="audio/mpeg">
</audio>

<div class="wrapper" id="mainContent">
    <div class="photos">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
    </div>
    <div class="container">
        <h1>TENYAAAA 🫀💍</h1>
        <p>Will you be my Valentine?<br><br>I love u so muchhhh...<br>Will u stay with me forever? 🥺</p>
        <div class="buttons">
            <button class="yes" onclick="showLove()">Yes 💖</button>
            <button class="no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No 😢</button>
        </div>
    </div>
    <div class="photos">
        <img src="photo3.jpg">
        <img src="photo4.jpg">
    </div>
</div>

<script>
    var song = document.getElementById("romanticSong");

    function initPage() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("mainContent").style.display = "flex";
        // Music start on click
        song.play().catch(e => console.log("Play error"));
    }

    function moveNo(){
        var btn = document.getElementById("noBtn");
        var x = Math.random() * (window.innerWidth - 100);
        var y = Math.random() * (window.innerHeight - 100);
        btn.style.left = x + "px";
        btn.style.top = y + "px";
    }

    function showLove(){
        document.getElementById("mainContent").innerHTML = "<h1 style='padding:20px; font-size:1.8rem;'>You just made me the happiest person alive ❤️🥹<br><br>🧿✨💍</h1>";
        setInterval(createHeart, 300);
    }

    function createHeart(){
        var heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random()*20 + 10) + "px";
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 5000);
    }
</script>
</body>
</html>
