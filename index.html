<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Love ❤️</title>
<style>
    body { margin:0; padding:0; min-height:100vh; overflow-x:hidden; font-family: 'Segoe UI', sans-serif; background: linear-gradient(45deg, #7a0019, #b3002d); display:flex; justify-content:center; align-items:center; text-align:center; color:white; }
    .wrapper{ display:flex; flex-direction: column; align-items:center; gap:10px; padding: 10px; width: 100%; transition: opacity 0.5s; }
    .photos{ display:flex; flex-direction:row; gap:10px; justify-content: center; }
    .photos img{ width:85px; height:115px; object-fit:cover; border-radius:12px; border:2px solid rgba(255,255,255,0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .container{ background: rgba(0,0,0,0.45); padding:25px; border-radius:25px; width: 85%; max-width:320px; z-index: 10; backdrop-filter: blur(5px); }
    button{ padding:12px 28px; font-size:16px; border:none; border-radius:30px; cursor:pointer; font-weight: bold; }
    .yes{ background:#ff4d6d; color:white; }
    .no{ background:white; color:#b3002d; position:absolute; z-index: 20; }
    .heart{ position:absolute; color:#ff4d6d; font-size:20px; animation:float 6s linear infinite; z-index: 1; pointer-events: none; }
    @keyframes float{ 0%{transform:translateY(100vh); opacity:1;} 100%{transform:translateY(-10vh); opacity:0;} }
</style>
</head>
<body onclick="playMusic()">

<audio id="romanticSong" loop>
  <source src="https://files.catbox.moe/978msh.mp3" type="audio/mpeg">
</audio>

<div class="wrapper" id="mainContent">
    <div class="photos">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
    </div>
    <div class="container">
        <h1>TENYAAAA 🫀💍💋</h1>
        <p>Will you be my Valentine?<br><br>I love u so muchhhh...<br>Will u stay with me forever? 🥺</p>
        <button class="yes" onclick="showLove()">Yes 💖</button>
        <button class="no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No 😢</button>
    </div>
    <div class="photos">
        <img src="photo3.jpg">
        <img src="photo4.jpg">
    </div>
</div>

<script>
    var audio = document.getElementById("romanticSong");
    var started = false;

    function playMusic() {
        if(!started) {
            audio.play().then(() => { audio.pause(); started = true; });
        }
    }

    function moveNo(){
        var btn=document.getElementById("noBtn");
        btn.style.left = Math.random() * (window.innerWidth - 100) + "px";
        btn.style.top = Math.random() * (window.innerHeight - 100) + "px";
    }

    function showLove(){
        audio.play();
        document.getElementById("mainContent").innerHTML = "<h1 style='padding:20px;'>You just made me the happiest person alive ❤️🥹<br><br>🧿✨💍</h1>";
        setInterval(createHeart, 300);
    }

    function createHeart(){
        var heart = document.createElement("div");
        heart.classList.add("heart"); heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 6000);
    }
</script>
</body>
</html>
